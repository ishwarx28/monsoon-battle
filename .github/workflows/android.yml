name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, build and lint
        run: ./gradlew --no-daemon :core:test :android:assembleDebug :android:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: monsoon-battle-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            core/build/reports/tests/test/
            android/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
